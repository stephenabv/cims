name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cims
          POSTGRES_PASSWORD: cims_dev_password
          POSTGRES_DB: cims_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cims" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cims:cims_dev_password@localhost:5432/cims_test?schema=public
      DATABASE_URL: postgresql://cims:cims_dev_password@localhost:5432/cims_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint & format
        run: pnpm lint && pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (unit + integration against PostgreSQL)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency audit (production deps, high+)
        run: pnpm audit --prod --audit-level high
